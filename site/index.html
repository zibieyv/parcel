<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>zibieyv</title>
<meta name="description" content="zibieyv 的小站：包裹看板、GitHub、一些入口。">
<meta property="og:title" content="zibieyv">
<meta property="og:description" content="一些自己做的小玩意儿，以及能找得到我的地方。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.zibieyv.com/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%233d7eff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1d222b; --line:#242a35;
  --text:#e8eaee; --dim:#8b93a1; --dim2:#5f6875; --accent:#3d7eff;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(61,126,255,.12), transparent 60%),
    var(--bg);
  color:var(--text);min-height:100vh;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:0 0 60px;
}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

/* 顶栏 */
header{padding:26px 0 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.4px;font-size:17px}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(61,126,255,.8)}
.top nav a{color:var(--dim);text-decoration:none;font-size:13px;margin-left:16px}
.top nav a:hover{color:var(--text)}

/* 视频 */
.bili{display:flex;justify-content:center;margin-top:22px}
.bili a{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  color:#c9d6f0;background:rgba(255,255,255,.05);border:1px solid var(--line);
  padding:9px 18px;border-radius:999px;font-size:13px;transition:.15s;
}
.bili a:hover{color:#fff;border-color:#2f4d85;background:rgba(61,126,255,.12)}
.bili .bi{color:#ff6699;font-size:11px}
.hero{margin-top:12px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#000;position:relative;aspect-ratio:16/9}
.hero video{width:100%;height:100%;object-fit:cover;display:block}
.mask{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55));transition:opacity .3s}
.mask.hide{opacity:0;pointer-events:none}
.sound{
  border:0;cursor:pointer;font:inherit;font-size:15px;font-weight:600;color:#111;
  background:#fff;padding:14px 22px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);
}
.sound:active{transform:scale(.97)}
.skip{
  border:0;cursor:pointer;font:inherit;font-size:12px;color:#cfd6e2;background:rgba(0,0,0,.35);
  padding:6px 12px;border-radius:999px;
}

/* 标题 */
.intro{margin:26px 0 18px}
.intro h1{margin:0;font-size:26px;letter-spacing:.5px}
.intro p{margin:8px 0 0;color:var(--dim);font-size:14px}

/* 导航卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:6px}
a.card{
  display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
a.card:hover{transform:translateY(-2px);border-color:#2f4d85;background:var(--card2)}
a.card .t{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}
a.card .t .arrow{color:var(--dim2);font-size:14px}
a.card .d{color:var(--dim);font-size:12.5px;margin-top:6px;line-height:1.6}
.tag{display:inline-block;font-size:11px;color:#9db8ff;background:#1b2740;border:1px solid #2f4d85;
  border-radius:7px;padding:1px 7px;margin-left:8px;vertical-align:1px}

footer{margin-top:44px;color:var(--dim2);font-size:12px;text-align:center}
footer a{color:var(--dim2)}
@media (max-width:480px){
  .intro h1{font-size:22px}
  .hero{margin-top:16px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="top">
      <div class="logo"><span class="dot"></span>zibieyv</div>
      <nav>
        <a href="https://parcel.zibieyv.com">包裹</a>
        <a href="https://github.com/zibieyv" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <div class="bili">
    <a href="https://www.bilibili.com/video/BV1GJ411x7h7" target="_blank" rel="noopener">
      <span class="bi">▶</span> 在哔哩哔哩看原版
    </a>
  </div>

  <div class="hero" id="hero">
    <video id="vid" src="/rickroll.mp4" muted autoplay playsinline loop preload="auto"></video>
    <div class="mask" id="mask">
      <button class="sound" id="soundBtn">🔊 点这里开声音</button>
      <button class="skip" id="skipBtn">跳過 ›</button>
    </div>
  </div>

  <div class="intro">
    <h1>随便看看</h1>
    <p>一些自己做的小玩意儿，以及能找得到我的地方。</p>
  </div>

  <div class="grid">
    <a class="card" href="https://parcel.zibieyv.com">
      <div class="t"><span>包裹看板<span class="tag">自用</span></span><span class="arrow">↗</span></div>
      <div class="d">淘宝 / 京东 / 拼多多 / 博客来的物流，一个界面看完，支持截图识单号。</div>
    </a>

    <a class="card" href="https://github.com/zibieyv" target="_blank" rel="noopener">
      <div class="t"><span>GitHub</span><span class="arrow">↗</span></div>
      <div class="d">代码都在这里，包括这个站点和上面那个包裹看板。</div>
    </a>

    <a class="card" href="https://pan.baidu.com/s/1WmPTGTfd5_UFzq4VnErjOg?pwd=7m8w" target="_blank" rel="noopener">
      <div class="t"><span>APK 下载<span class="tag">百度网盘</span></span><span class="arrow">↗</span></div>
      <div class="d">包裹 App 的安装包，提取码 7m8w。</div>
    </a>

  </div>

  <footer>
    © 2026 zibieyv · 本站与 <a href="https://parcel.zibieyv.com">包裹</a> 同源
  </footer>
</div>

<script>
(function () {
  var v = document.getElementById('vid');
  var mask = document.getElementById('mask');
  var soundBtn = document.getElementById('soundBtn');
  var skipBtn = document.getElementById('skipBtn');

  // 静音自动播放（浏览器都允许），点按钮才放声音
  v.play().catch(function () { /* 被拦截就等用户点 */ });

  soundBtn.addEventListener('click', function () {
    v.muted = false;
    v.currentTime = 0;
    v.play().catch(function () {});
    mask.classList.add('hide');
  });

  skipBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    v.pause();
    document.getElementById('hero').style.display = 'none';
  });
})();
</script>
</body>
</html>
