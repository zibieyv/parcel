<!doctype html>
<html lang="zh-CN">
<head>

<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1d222b; --line:#242a35;
  --text:#e8eaee; --dim:#8b93a1; --dim2:#5f6875; --accent:#3d7eff;
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(61,126,255,.12), transparent 60%),
    var(--bg);
  color:var(--text);min-height:100vh;
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding:0 0 60px;
}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}

/* 顶栏 */
header{padding:26px 0 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.4px;font-size:17px}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(61,126,255,.8)}
.top nav a{color:var(--dim);text-decoration:none;font-size:13px;margin-left:16px}
.top nav a:hover{color:var(--text)}

/* 视频 */
.hero{margin-top:22px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#000;position:relative;aspect-ratio:16/9}
.hero iframe{width:100%;height:100%;border:0;display:block}
.poster{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;cursor:pointer;background:
    radial-gradient(600px 300px at 50% 40%, rgba(61,126,255,.22), transparent 70%),
    repeating-linear-gradient(45deg, #141821 0 12px, #12151c 12px 24px);
  transition:opacity .25s ease;
}
.poster.hide{opacity:0;pointer-events:none}
.play{
  width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.94);
  display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.play::after{content:"";display:block;margin-left:6px;
  border-left:22px solid #111;border-top:14px solid transparent;border-bottom:14px solid transparent}
.poster b{font-size:15px;font-weight:600;letter-spacing:.5px}
.poster span{font-size:12px;color:var(--dim2)}

/* 标题 */
.intro{margin:26px 0 18px}
.intro h1{margin:0;font-size:26px;letter-spacing:.5px}
.intro p{margin:8px 0 0;color:var(--dim);font-size:14px}

/* 导航卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:6px}
a.card{
  display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
a.card:hover{transform:translateY(-2px);border-color:#2f4d85;background:var(--card2)}
a.card .t{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:15px}
a.card .t .arrow{color:var(--dim2);font-size:14px}
a.card .d{color:var(--dim);font-size:12.5px;margin-top:6px;line-height:1.6}
.tag{display:inline-block;font-size:11px;color:#9db8ff;background:#1b2740;border:1px solid #2f4d85;
  border-radius:7px;padding:1px 7px;margin-left:8px;vertical-align:1px}

footer{margin-top:44px;color:var(--dim2);font-size:12px;text-align:center}
footer a{color:var(--dim2)}
@media (max-width:480px){
  .intro h1{font-size:22px}
  .hero{margin-top:16px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="top">
      <div class="logo"><span class="dot"></span>zibieyv</div>
      <nav>
        <a href="https://parcel.zibieyv.com">包裹</a>
        <a href="https://github.com/zibieyv" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <div class="hero" id="hero">
    <div class="poster" id="poster">
      <div class="play"></div>
      <b>点一下，聆听经典</b>
      <span>建议配合耳机食用</span>
    </div>
  </div>

  <div class="intro">
    <h1>随便看看</h1>
    <p>一些自己做的小玩意儿，以及能找得到我的地方。</p>
  </div>

  <div class="grid">
    <a class="card" href="https://parcel.zibieyv.com">
      <div class="t"><span>包裹看板<span class="tag">自用</span></span><span class="arrow">↗</span></div>
      <div class="d">淘宝 / 京东 / 拼多多 / 博客来的物流，一个界面看完，支持截图识单号。</div>
    </a>

    <a class="card" href="https://github.com/zibieyv" target="_blank" rel="noopener">
      <div class="t"><span>GitHub</span><span class="arrow">↗</span></div>
      <div class="d">代码都在这里，包括这个站点和上面那个包裹看板。</div>
    </a>

    <a class="card" href="https://pan.baidu.com/s/1WmPTGTfd5_UFzq4VnErjOg?pwd=7m8w" target="_blank" rel="noopener">
      <div class="t"><span>APK 下载<span class="tag">百度网盘</span></span><span class="arrow">↗</span></div>
      <div class="d">包裹 App 的安装包，提取码 7m8w。</div>
    </a>

    <a class="card" href="mailto:2182098237@qq.com">
      <div class="t"><span>邮件</span><span class="arrow">↗</span></div>
      <div class="d">有事找我，发邮件最快。</div>
    </a>
  </div>

  <footer>
    © 2026 zibieyv · 本站与 <a href="https://parcel.zibieyv.com">包裹</a> 同源
  </footer>
</div>

<script>
(function () {
  var poster = document.getElementById('poster');
  var hero = document.getElementById('hero');
  var loaded = false;

  poster.addEventListener('click', function () {
    if (loaded) return;
    loaded = true;
    poster.classList.add('hide');
    var f = document.createElement('iframe');
    f.src = 'https://player.bilibili.com/player.html?bvid=BV1Zf4y1m7eR&page=1&high_quality=1&danmaku=0&autoplay=1';
    f.allow = 'autoplay; fullscreen';
    f.setAttribute('allowfullscreen', 'true');
    f.setAttribute('scrolling', 'no');
    hero.appendChild(f);
  });
})();
</script>
</body>
</html>
