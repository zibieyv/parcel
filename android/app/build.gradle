plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zibieyv.parcel'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zibieyv.parcel'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.11'
    }

    buildFeatures {
        buildConfig true
    }

    // 固定签名：以后升级可以直接覆盖安装，不用先卸载
    signingConfigs {
        parcel {
            storeFile file('../keystore/parcel.jks')
            storePassword 'parcel2026'
            keyAlias 'parcel'
            keyPassword 'parcel2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.parcel
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.parcel
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
