plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zibieyv.parcel'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zibieyv.parcel'
        minSdk 26
        targetSdk 34
        versionCode 31
        versionName '0.31'

        // 只保留手机实际使用的两种 ARM 架构，OCR 模型库体积能少一半
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // 固定签名：以后升级可以直接覆盖安装，不用先卸载
    signingConfigs {
        parcel {
            storeFile file('../keystore/parcel.jks')
            storePassword 'parcel2026'
            keyAlias 'parcel'
            keyPassword 'parcel2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.parcel
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.parcel
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // 离线中文 OCR：截屏识图用，不联网、不用 Google 服务
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
}
