plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zibieyv.parcel'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zibieyv.parcel'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            // CI 里用 debug 签名，能装就行
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
