<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>包裹</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1d222b; --line:#242a35; --text:#e8eaee;
  --dim:#8b93a1; --dim2:#5f6875; --accent:#3d7eff; --ok:#35d07f; --warn:#f5b545; --bad:#ff6b6b;
  --radius:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);min-height:100vh;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(96px + var(--safe-b));
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{
  font:inherit;width:100%;background:#0d1016;color:var(--text);
  border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}

/* 顶栏 */
header{
  position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:14px 16px 10px;
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcount{font-size:12px;color:var(--dim);font-weight:400;margin-left:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.ball-pill{
  display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:12px;flex:0 0 auto;
  background:var(--card);border:1px solid var(--line);font-size:12px;color:#9db8ff;white-space:nowrap;
}
.ball-pill i{font-style:normal;font-size:12px}
.ball-pill.off{color:var(--dim2)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.updatebar{
  display:none;align-items:center;justify-content:space-between;gap:12px;
  margin:0 16px 0;padding:10px 14px;border-radius:12px;background:#1b2740;border:1px solid #2f4d85;
  font-size:13px;color:#a8c4ff;
}
.updatebar button{
  flex:0 0 auto;padding:8px 14px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;
}
.warnbar{
  display:none;align-items:center;justify-content:space-between;gap:12px;
  margin:0 16px;padding:10px 14px;border-radius:12px;
  background:#3a2a10;border:1px solid #6b4d16;font-size:13px;color:#fbbf24;
}
.warnbar button{
  flex:0 0 auto;padding:8px 14px;border-radius:9px;background:#f5b545;color:#2a1d05;
  font-size:13px;font-weight:600;
}
#upModal{
  position:fixed;inset:0;z-index:90;display:none;place-items:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
}
.up-card{
  width:78%;max-width:320px;background:#171a21;border:1px solid var(--line);
  border-radius:18px;padding:22px 20px;text-align:center;
}
.up-track{height:10px;border-radius:5px;background:#0d1016;overflow:hidden;margin:16px 0 8px}
#upBar{height:100%;width:0;background:var(--accent);transition:width .25s ease}

#pullHint{
  position:fixed;left:50%;top:66px;transform:translate(-50%,-46px);opacity:0;
  background:#1b2740;border:1px solid #2f4d85;color:#a8c4ff;
  padding:8px 16px;border-radius:999px;font-size:13px;z-index:40;pointer-events:none;
  transition:transform .18s ease,opacity .18s ease;white-space:nowrap;
}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:13px;color:var(--dim);white-space:nowrap;
}
.chip.on{background:#1b2740;border-color:#2f4d85;color:#a8c4ff}
.chip em{font-style:normal;font-size:11px;opacity:.75;margin-left:4px}
.chip-picker{display:flex;flex-wrap:wrap;gap:8px}
.chip-picker .chip{background:#0d1016;border:1px solid var(--line);color:var(--dim)}
.chip-picker .chip.on{background:#1b2740;border-color:#2f4d85;color:#a8c4ff}

/* 列表 */
main{padding:14px 16px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;position:relative;overflow:hidden;
}
.card.done{opacity:.62}
.card .top{display:flex;align-items:flex-start;gap:10px}
.pf{
  flex:0 0 auto;font-size:11px;padding:3px 8px;border-radius:7px;background:#232a36;
  color:#b9c2d0;margin-top:2px;text-align:center;line-height:1.25;
}
.pf i{display:block;font-style:normal;font-size:11px}
.title{flex:1;min-width:0}
.title b{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title b .nt{font-weight:400;font-size:13px;color:var(--dim)}
.title .nm{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner{display:inline-block;font-size:11px;font-weight:400;color:#9db8ff;background:#1b2740;border:1px solid #2f4d85;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.title .nt2{font-size:12px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bodyRow{display:flex;gap:12px;margin-top:12px;align-items:flex-start}
.leftCol{flex:0 0 96px;min-width:0}
.leftCol .t{font-size:11px;color:var(--dim2);font-family:ui-monospace,monospace;line-height:1.4}
.leftCol .c{font-size:11px;color:var(--dim2);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rightCol{flex:1;min-width:0;font-size:13px;color:#c3cad6;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.title .no{font-size:12px;color:var(--dim2);font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:2px;letter-spacing:.3px}
.status{font-size:12px;padding:4px 10px;border-radius:999px;background:#24304a;color:#9db8ff;white-space:nowrap}
.status.delivered{background:#17351f;color:#6ee7a0}
.status.delivering,.status.pickup{background:#3a2a10;color:#fbbf24}
.status.exception{background:#3a1a1a;color:#ff9b9b}

.latest{font-size:14px;color:#c3cad6;margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--dim2);margin-top:6px}
.pickup{
  margin-top:12px;background:#10241a;border:1px dashed #2f6b4b;border-radius:12px;
  padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.pickup span{font-size:12px;color:#7fd0a4}
.pickup b{font-size:26px;letter-spacing:3px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#7cf0ae}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{
  flex:1;padding:9px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
  font-size:13px;color:#c8d0dc;
}
.acts button:active{background:#2a3240}

.empty{text-align:center;color:var(--dim2);padding:70px 20px;font-size:14px;line-height:2}
.empty b{display:block;font-size:44px;margin-bottom:10px;opacity:.5}

/* 底部按钮 */
.fab{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b));
  background:var(--accent);color:#fff;border-radius:999px;padding:14px 30px;font-weight:600;
  box-shadow:0 8px 24px rgba(61,126,255,.4);z-index:30;font-size:15px;
}

/* 弹层 */
.sheet{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
}
.sheet.on{display:block}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:#141821;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + var(--safe-b));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-size:16px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.sheet .x{color:var(--dim);font-size:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;margin-top:6px}
.danger{color:#ff8a8a}
.ghost{width:100%;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-top:8px;font-size:14px}

/* 详情时间线 */
.tl{margin-top:8px}
.tl .ev{padding:12px 0 12px 18px;border-left:2px solid var(--line);position:relative}
.tl .ev:last-child{border-left-color:transparent}
.tl .ev::before{content:"";position:absolute;left:-5px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--dim2)}
.tl .ev:first-child::before{background:var(--accent);box-shadow:0 0 0 4px rgba(61,126,255,.15)}
.tl .t{font-size:11px;color:var(--dim2);font-family:ui-monospace,monospace}
.tl .d{font-size:14px;margin-top:3px;color:#d5dbe4}
.tl .w{font-size:12px;color:var(--dim2);margin-top:2px}
.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);
  background:#2b3444;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
  opacity:0;transition:.2s;z-index:80;pointer-events:none;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>包裹<span class="hcount" id="cnt"></span></h1>
    <div style="display:flex;gap:8px;flex:0 0 auto;align-items:center">
      <button class="ball-pill" id="ballBtn" title="悬浮球" style="display:none"><i id="ballDot">◉</i><span>悬浮球</span></button>
      <button class="icon-btn" id="refreshAll" title="全部刷新">↻</button>
      <button class="icon-btn" id="accountBtn" title="账号">👤</button>
      <button class="icon-btn" id="openSettings" title="设置">⚙</button>
    </div>
  </div>
  <div class="filters" id="groupFilters"></div>
  <div class="filters" id="typeFilters" style="padding-top:6px"></div>
</header>

<div class="updatebar" id="updateBar"></div>
<div class="warnbar" id="accBar"></div>
<div id="pullHint">下拉刷新</div>

<main id="list"></main>

<button class="fab" id="addBtn">＋ 添加包裹</button>

<!-- 添加/编辑 -->
<div class="sheet" id="editSheet">
  <div class="panel">
    <h2><span id="editTitle">添加包裹</span><button class="x" data-close>取消</button></h2>
    <div class="field"><label>内容物 / 名称（可留空）</label><input id="f_name" placeholder="例：恋人不行 5-8"></div>
    <div class="field"><label>快递单号（必填）</label><input id="f_no" placeholder="通过购物软件获取" autocapitalize="characters"></div>
    <div class="row2">
      <div class="field"><label>平台</label>
        <select id="f_platform">
          <option value="other" selected>默认其他</option>
          <option value="taobao">淘宝</option><option value="jd">京东</option>
          <option value="pdd">拼多多</option><option value="douyin">抖音商城</option>
          <option value="taobaoflash">淘宝闪送</option><option value="meituan">美团外卖</option>
          <option value="jdwaimai">京东外卖</option><option value="books">博客来</option>
        </select>
      </div>
      <div class="field"><label>分组（可多选）</label>
        <div id="f_groups" class="chip-picker"></div>
        <button class="ghost" id="newGroupBtn" style="margin-top:8px">＋ 新建分组</button>
      </div>
    </div>
    <div class="field"><label>取件码（大多留空，到站会自动填）</label><input id="f_pickup" placeholder="6-4-12003"></div>
    <div class="field"><label>备注（可留空）</label><textarea id="f_note" placeholder="放哪个驿站 / 给谁的 / 多少钱"></textarea></div>
    <div class="field"><label>承运商（查不到轨迹时手动指定）</label>
      <select id="f_carrier">
        <option value="">自动识别</option>
        <option value="yuantong">圆通</option>
        <option value="zhongtong">中通</option>
        <option value="yunda">韵达</option>
        <option value="shentong">申通</option>
        <option value="jtexpress">极兔</option>
        <option value="shunfeng">顺丰</option>
        <option value="youzhengguonei">邮政快递包裹</option>
        <option value="ems">EMS</option>
        <option value="jd">京东</option>
      </select>
    </div>
    <button class="primary" id="saveItem">保存</button>
    <button class="ghost danger" id="delItem" style="display:none">删除这个包裹</button>
  </div>
</div>

<!-- 详情 -->
<div class="sheet" id="detailSheet">
  <div class="panel">
    <h2><span id="d_title">轨迹</span><button class="x" data-close>关闭</button></h2>
    <div id="d_body"></div>
  </div>
</div>

<!-- 设置 -->
<div class="sheet" id="setSheet">
  <div class="panel">
    <h2><span>设置</span><button class="x" data-close>关闭</button></h2>

    <div style="margin-bottom:22px">
      <div class="field"><label>和他人共享</label></div>
      <div style="display:flex;gap:10px">
        <button class="ghost" id="shareBtn">生成分享码</button>
        <button class="ghost" id="importShareBtn">导入分享码</button>
      </div>
      <p style="font-size:12px;color:var(--dim2);line-height:1.7;margin-top:10px">
        分享码是一段文本，发给对方粘进来即可导入（按单号自动去重合并）。
      </p>
    </div>

    <div style="margin-top:22px">
      <div class="field"><label>家庭码</label></div>
      <p style="font-size:12px;color:var(--dim2);line-height:1.7;margin-bottom:10px">
        家庭码在右上角 👤 账号页里管理，可以加多个房间。
      </p>
    </div>
    <div class="field" style="margin-top:22px"><label>接口地址</label><input id="s_base" placeholder="https://parcel-seven-omega.vercel.app"></div>
    <div class="field"><label>APP_TOKEN</label><input id="s_token" placeholder="与 Vercel 环境变量一致"></div>
    <button class="primary" id="saveSettings">保存</button>

    <div id="appBox" style="display:none;margin-top:22px">
      <div class="field"><label>权限与系统能力</label></div>
      <button class="ghost" id="permBtn">权限确认</button>
      <button class="ghost" id="checkUpdateBtn">检查更新</button>
      <p id="accState" style="font-size:12px;color:var(--dim2);line-height:1.7;margin-top:10px"></p>
    </div>

    <a href="/apk/parcel-0.37.apk?v=37" download
       style="display:block;text-align:center;margin-top:22px;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:14px;color:#c8d0dc;text-decoration:none">
      下载安卓 App（v0.37，截屏抓单号）
    </a>

    <div style="margin-top:22px;display:flex;gap:10px">
      <button class="ghost" id="exportData">导出备份</button>
      <button class="ghost" id="importData">导入备份</button>
    </div>
    <div class="field" style="margin-top:22px"><label>百度网盘分享链接（可选）</label>
      <input id="s_baidu" placeholder="https://pan.baidu.com/s/xxxx">
    </div>
    <p style="font-size:12px;color:var(--dim2);line-height:1.7;margin-top:16px">
      数据只存在这台设备的浏览器里，不上传。换手机或清缓存前先导出备份。
    </p>
  </div>
</div>

<!-- 新建 / 编辑分组 -->
<div class="sheet" id="groupSheet">
  <div class="panel">
    <h2><span id="groupTitle">新建分组</span><button class="x" data-close>关闭</button></h2>
    <div class="field"><label>分组名</label><input id="groupName" placeholder="比如：我的 / 家人 / 办公室"></div>
    <button class="primary" id="groupSave">保存</button>
    <button class="ghost danger" id="groupDelete" style="display:none">删除这个分组</button>
  </div>
</div>

<div id="upModal">
  <div class="up-card">
    <div style="font-size:15px;font-weight:600">正在下载新版本</div>
    <div class="up-track"><div id="upBar"></div></div>
    <div id="upText" style="font-size:12px;color:var(--dim)">0%</div>
    <div style="font-size:11px;color:var(--dim2);margin-top:12px;line-height:1.6">
      下载完成后会自动弹出安装界面；没弹的话，去通知栏点一下「包裹 App 更新」。
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none">

<!-- 更新方式 -->
<div class="sheet" id="updateSheet">
  <div class="panel">
    <h2><span>选择更新方式</span><button class="x" data-close>关闭</button></h2>
    <button class="ghost" id="upApp" style="padding:16px;text-align:left">
      <b style="display:block;font-size:15px">此应用更新</b>
      <span style="font-size:12px;color:var(--dim)">直接下载安装，带进度条</span>
    </button>
    <button class="ghost" id="upBaidu" style="padding:16px;text-align:left;margin-top:10px">
      <b style="display:block;font-size:15px">百度网盘更新</b>
      <span style="font-size:12px;color:var(--dim)">跳到网盘下载，适合装不上时用</span>
    </button>
  </div>
</div>

<!-- 账号 -->
<div class="sheet" id="accountSheet">
  <div class="panel">
    <h2><span>我的账号</span><button class="x" data-close>关闭</button></h2>
    <div class="field"><label>昵称（家人看到的就是这个）</label><input id="accName" placeholder="比如：小李"></div>
    <button class="primary" id="accSave">保存昵称</button>

    <div style="margin-top:22px">
      <div class="field"><label>我加入的家庭码</label></div>
      <div id="accRooms" style="font-size:13px;color:var(--dim);line-height:1.9;margin-bottom:12px"></div>
      <div class="row2">
        <div class="field"><label>家庭码</label><input id="accRoomCode" placeholder="如 7Q2K9M" autocapitalize="characters"></div>
        <div class="field"><label>分组名（可留空）</label><input id="accRoomGroup" placeholder="默认跟随命名者"></div>
      </div>
      <button class="ghost" id="accJoin">加入这个家庭码</button>
      <button class="ghost" id="accSync" style="margin-top:8px">立即同步全部房间</button>
    </div>
    <p style="font-size:12px;color:var(--dim2);line-height:1.7;margin-top:14px">
      昵称只用来在包裹上标"是谁的"，不涉及任何账号密码。
    </p>
  </div>
</div>

<!-- 权限确认 -->
<div class="sheet" id="permSheet">
  <div class="panel">
    <h2><span>权限确认</span><button class="x" data-close>关闭</button></h2>
    <div id="permList"></div>
    <p style="font-size:12px;color:var(--dim2);line-height:1.7;margin-top:14px">
      截图那条是系统弹的「开始录制或投放」，选「整个屏幕」即可；其余都是系统设置里的开关。
    </p>
  </div>
</div>

<!-- 分享 / 导入 -->
<div class="sheet" id="shareSheet">
  <div class="panel">
    <h2><span id="shareTitle">分享码</span><button class="x" data-close>关闭</button></h2>
    <div class="field">
      <label id="shareHint">把下面这段发给对方，让他粘进「导入分享码」</label>
      <textarea id="shareText" style="min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea>
    </div>
    <button class="primary" id="shareAction">复制</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const KEY = 'parcel.v1';
  const PLATFORM_NAME = {
    taobao:'淘宝', jd:'京东', pdd:'拼多多', douyin:'抖音', taobaoflash:'淘宝闪送',
    meituan:'美团', jdwaimai:'京东外卖', books:'博客来', other:'默认'
  };
  const STATUS_NAME = {
    pending:'待发货', in_transit:'运输中', pickup:'待取件', delivering:'派送中',
    delivered:'已签收', exception:'异常', notfound:'暂无轨迹'
  };

  const $ = (id) => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // 轨迹文本里偶尔会带取件码（驿站/快递柜），顺手捡出来
  const PICKUP_RE = /(?:取件[码碼]|提货[码碼]|提貨[码碼]|取货[码碼]|领取[码碼])[^0-9]{0,6}([0-9][0-9\-]{2,12})/;
  function detectPickup(text) {
    if (!text) return '';
    const m = String(text).match(PICKUP_RE);
    if (!m) return '';
    return m[1].replace(/[^0-9\-]/g, '');
  }

  /* ---------- 存储 ---------- */
  const defaults = {
    items: [],
    groups: ['我的'],
    deleted: {},
    settings: { base: location.origin, token: '', rooms: [], nickname: '', deviceId: '', members: {}, baiduUrl: 'https://pan.baidu.com/s/1WmPTGTfd5_UFzq4VnErjOg?pwd=7m8w' },
  };
  let db = load();
  dedupeByNo();

  /** 旧数据只有 group，新数据用 groups 数组，读进来统一 */
  function normalizeItem(it) {
    if (!it || typeof it !== 'object') return it;
    let gs = Array.isArray(it.groups) ? it.groups.slice() : null;
    if (!gs) gs = it.group ? [it.group] : [];
    return { ...it, groups: gs, group: gs[0] || '' };
  }

  /** 这个包裹是否属于某个分组（'none' = 未分组） */
  function itemInGroup(it, key) {
    const gs = Array.isArray(it.groups) ? it.groups : (it.group ? [it.group] : []);
    if (key === 'none') return gs.length === 0;
    return gs.includes(key);
  }

  /**
   * 按单号去重：两台手机各自加了同一个单号时 id 不同，但其实是同一件。
   * 留 updatedAt 新的，分组取并集，空字段从旧的那条补。
   */
  function dedupeByNo() {
    const byNo = new Map();
    const rest = [];
    for (const it of db.items) {
      const key = String(it.no || '').toUpperCase().trim();
      if (!key) { rest.push(it); continue; }
      const prev = byNo.get(key);
      if (!prev) { byNo.set(key, it); continue; }

      const keep = (it.updatedAt || '') >= (prev.updatedAt || '') ? it : prev;
      const drop = keep === it ? prev : it;
      const gs = Array.from(new Set([
        ...(Array.isArray(keep.groups) ? keep.groups : (keep.group ? [keep.group] : [])),
        ...(Array.isArray(drop.groups) ? drop.groups : (drop.group ? [drop.group] : [])),
      ]));
      keep.groups = gs;
      keep.group = gs[0] || '';
      if (!keep.note && drop.note) keep.note = drop.note;
      if (!keep.pickup && drop.pickup) keep.pickup = drop.pickup;
      if (!keep.name && drop.name) keep.name = drop.name;
      byNo.set(key, keep);

      const idx = rest.indexOf(drop);
      if (idx >= 0) rest.splice(idx, 1);
    }
    db.items = [...byNo.values()].concat(rest);
  }

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!raw) return { ...defaults, groups: [...defaults.groups], deleted: {} };
      return {
        items: (Array.isArray(raw.items) ? raw.items : []).map(normalizeItem),
        groups: Array.isArray(raw.groups) ? raw.groups : [...defaults.groups],
        pendingCodes: Array.isArray(raw.pendingCodes) ? raw.pendingCodes : [],
        deleted: raw.deleted && typeof raw.deleted === 'object' ? raw.deleted : {},
        settings: (() => {
          const st = { ...defaults.settings, ...(raw.settings || {}) };
          if (!Array.isArray(st.rooms)) st.rooms = [];
          if (!st.rooms.length && st.room) {
            st.rooms = [{ code: st.room, group: st.roomGroup || '', members: st.members || {} }];
          }
          st.rooms.forEach((r) => { if (!r.members) r.members = {}; });
          if (!st.baiduUrl) st.baiduUrl = defaults.settings.baiduUrl;
          delete st.room; delete st.roomGroup;
          return st;
        })(),
      };
    } catch {
      return { ...defaults, groups: [...defaults.groups], deleted: {} };
    }
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(db));
    scheduleSync();
  }

  /* ---------- 工具 ---------- */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
  }
  function fmtTime(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d)) return s;
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function relTime(s) {
    if (!s) return '';
    const diff = (Date.now() - new Date(s).getTime()) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return `${Math.floor(diff/60)} 分钟前`;
    if (diff < 86400) return `${Math.floor(diff/3600)} 小时前`;
    return `${Math.floor(diff/86400)} 天前`;
  }

  /* ---------- 筛选：第一行分组（可多选），第二行状态（带计数） ---------- */
  let filter = { groups: [], status: 'all' };
  let lpFired = false;

  /** 当前分组范围内的包裹（groups 为空 = 全部） */
  function groupScope() {
    if (!filter.groups.length) return db.items;
    return db.items.filter((i) => filter.groups.some((k) => itemInGroup(i, k)));
  }

  function statusMatched(i, status) {
    if (status === 'archived') return !!i.archived;
    if (i.archived) return false;
    if (status === 'active') return !['delivered', 'exception'].includes(i.status);
    if (status === 'pickup') return i.status === 'pickup' || (i.pickup && i.status !== 'delivered');
    return true;
  }

  function refreshFilters() {
    // 第一行：分组（可多选；「全部」= 清空选择）
    const groups = [{ key: 'none', name: '未分组' }]
      .concat(db.groups.map((g) => ({ key: g, name: g })));
    const allOn = filter.groups.length === 0;
    let groupHtml = `<button class="chip ${allOn?'on':''}" data-g="__all" data-group="1">全部</button>`;
    groupHtml += groups
      .map((g) => `<button class="chip ${filter.groups.includes(g.key)?'on':''}" data-g="${esc(g.key)}" data-group="1">${esc(g.name)}</button>`)
      .join('');
    groupHtml += `<button class="chip" data-g="__new" data-group="1" style="color:#9db8ff">＋</button>`;

    // 第二行：状态（计数基于当前分组）
    const scope = groupScope();
    const counts = {
      all: scope.filter((i) => !i.archived).length,
      active: scope.filter((i) => statusMatched(i, 'active')).length,
      pickup: scope.filter((i) => statusMatched(i, 'pickup')).length,
      archived: scope.filter((i) => i.archived).length,
    };
    const statuses = [
      ['all', '全部', counts.all],
      ['active', '在途', counts.active],
      ['pickup', '待取件', counts.pickup],
      ['archived', '已归档', counts.archived],
    ];
    const statusHtml = statuses
      .map(([k, n, c]) => `<button class="chip ${filter.status===k?'on':''}" data-s="${k}">${n}${c ? `<em>${c}</em>` : ''}</button>`)
      .join('');

    $('groupFilters').innerHTML = groupHtml;
    $('typeFilters').innerHTML = statusHtml;

    $('groupFilters').onclick = (e) => {
      const b = e.target.closest('[data-g]');
      if (!b || lpFired) { lpFired = false; return; }
      const key = b.dataset.g;
      if (key === '__new') { openGroupSheet(null); return; }
      if (key === '__all') {
        filter.groups = [];
      } else {
        const i = filter.groups.indexOf(key);
        if (i >= 0) filter.groups.splice(i, 1);
        else filter.groups.push(key);
      }
      refreshFilters();
      render();
    };

    $('typeFilters').onclick = (e) => {
      const b = e.target.closest('[data-s]');
      if (!b) return;
      filter.status = b.dataset.s;
      refreshFilters();
      render();
    };

    // 长按分组胶囊 → 改名 / 删除
    let lpTimer = null;
    $('groupFilters').ontouchstart = (e) => {
      const b = e.target.closest('[data-g]');
      const key = b && b.dataset.g;
      if (!key || key === '__all' || key === 'none' || key === '__new') return;
      clearTimeout(lpTimer);
      lpTimer = setTimeout(() => {
        lpFired = true;
        openGroupSheet(key);
      }, 550);
    };
    ['touchend', 'touchmove', 'touchcancel'].forEach((ev) => {
      $('groupFilters').addEventListener(ev, () => clearTimeout(lpTimer), { passive: true });
    });
  }

  /* ---------- 列表 ---------- */
  function visibleItems() {
    const list = groupScope().filter((i) => statusMatched(i, filter.status));
    return list.sort((a, b) => {
      const rank = (x) => x.status === 'delivered' ? 2 : (x.pickup ? 0 : 1);
      const r = rank(a) - rank(b);
      if (r) return r;
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });
  }

  function render() {
    const list = visibleItems();
    $('cnt').textContent = list.length ? `${list.length} 件` : '';
    const pending = (db.pendingCodes || []).map((p) => `
      <div class="card" style="border-color:#4a3a12;background:#1e1a10">
        <div class="top">
          <span class="pf">取件码</span>
          <div class="title"><b>${esc(p.code)}</b><div class="no">来自 ${esc(p.source || '未知')} · 还没归到哪个包裹</div></div>
        </div>
        <div class="acts"><button data-apply="${esc(p.code)}">应用到包裹</button></div>
      </div>`).join('');
    if (!list.length && !pending) {
      $('list').innerHTML = `<div class="empty"><b>📦</b>还没有包裹<br><span style="color:var(--dim2);font-size:13px">点下面的按钮，粘一个单号进来</span></div>`;
      return;
    }
    $('list').innerHTML = pending + list.map(cardHtml).join('');
  }

  function cardHtml(it) {
    const st = it.status || 'pending';
    const cls = st === 'delivered' ? 'done' : '';
    const pickup = it.pickup ? `
      <div class="pickup" data-copy="${esc(it.pickup)}">
        <span>取件码</span><b>${esc(it.pickup)}</b>
      </div>` : '';
    const when = it.latestTime ? fmtTime(it.latestTime) : (it.updatedAt ? fmtTime(it.updatedAt) : '');
    const note = it.note ? String(it.note).replace(/\s+/g, ' ') : '';
    return `
      <div class="card ${cls}" data-id="${it.id}">
        <div class="top">
          <span class="pf">${it.platform === 'other'
            ? '<i>默认</i><i>其他</i>'
            : esc(PLATFORM_NAME[it.platform] || '默认')}</span>
          <div class="title">
            <b class="nm">${esc(it.name || it.no || '未命名')}${it.owner ? `<span class="owner">${esc(it.owner)}</span>` : ''}</b>
            ${note ? `<div class="nt2">备注：${esc(note)}</div>` : ''}
            ${it.no ? `<div class="no">${esc(it.no)}</div>` : ''}
          </div>
          <span class="status ${st}">${esc(STATUS_NAME[st] || st)}</span>
        </div>
        <div class="bodyRow">
          <div class="leftCol">
            <div class="t">${esc(when || '—')}</div>
            <div class="c">${esc(it.carrier || '')}</div>
          </div>
          <div class="rightCol">${esc(it.latest || '暂无轨迹')}</div>
        </div>
        ${pickup}
        <div class="acts">
          <button data-act="refresh">刷新轨迹</button>
          <button data-act="edit">编辑</button>
          ${it.archived
            ? '<button data-act="unarchive">恢复</button>'
            : (st === 'delivered' ? '<button data-act="archive">归档</button>' : '')}
        </div>
      </div>`;
  }

  $('list').addEventListener('click', async (e) => {
    const applyBtn = e.target.closest('[data-apply]');
    if (applyBtn) {
      const code = applyBtn.dataset.apply;
      const target = db.items.filter((i) => !i.archived && i.status !== 'delivered' && !i.pickup)[0];
      if (!target) { toast('先添加一个在途包裹'); return; }
      target.pickup = code;
      db.pendingCodes = (db.pendingCodes || []).filter((p) => p.code !== code);
      save(); render();
      toast(`已应用到「${target.name || target.no || '包裹'}」`);
      return;
    }
    const copyEl = e.target.closest('[data-copy]');
    if (copyEl) {
      try { await navigator.clipboard.writeText(copyEl.dataset.copy); toast('取件码已复制'); }
      catch { toast(copyEl.dataset.copy); }
      return;
    }
    const card = e.target.closest('.card');
    if (!card) return;
    const it = db.items.find((x) => x.id === card.dataset.id);
    if (!it) return;
    const btn = e.target.closest('[data-act]');
    if (btn) {
      e.stopPropagation();
      const act = btn.dataset.act;
      if (act === 'refresh') refreshOne(it, btn);
      if (act === 'edit') openEdit(it);
      if (act === 'archive') {
        it.archived = true; it.updatedAt = new Date().toISOString(); save(); render(); toast('已归档，去「已归档」里找');
      }
      if (act === 'unarchive') {
        it.archived = false; it.updatedAt = new Date().toISOString(); save(); render(); toast('已恢复到列表');
      }
      return;
    }
    openDetail(it);
  });

  /* ---------- 查询 ---------- */
  // 国内承运商：17TRACK 基本没数据，改由手机直连快递100（国内 IP 才查得到）
  const KD_TYPE = [
    [/^YT\d{10,}/, 'yuantong'],
    [/^ZT\d{10,}/, 'zhongtong'],
    [/^YD\d{10,}/, 'yunda'],
    [/^JT\d{10,}/, 'jtexpress'],
    [/^SF\d{10,}/, 'shunfeng'],
    [/^JD[A-Z0-9]{10,}/, 'jd'],
    [/^9[1-8]\d{11}$/, 'youzhengguonei', 'ems'],
  ];
  const KD_STATE = {
    0: ['in_transit', '运输中'], 1: ['in_transit', '已揽收'], 2: ['exception', '疑难'],
    3: ['delivered', '已签收'], 4: ['exception', '退签'], 5: ['delivering', '派送中'],
    6: ['exception', '退回'], 7: ['exception', '转投'], 8: ['in_transit', '清关'],
    14: ['exception', '拒签'],
  };

  function domesticTypes(no) {
    const n = String(no || '').toUpperCase();
    for (const [re, ...types] of KD_TYPE) if (re.test(n)) return types;
    if (/^\d{12,15}$/.test(n)) return ['yunda', 'zhongtong', 'yuantong', 'shentong', 'jtexpress'];
    return null;
  }

  function kdUrl(no, type) {
    return 'https://www.kuaidi100.com/query?type=' + encodeURIComponent(type) +
      '&postid=' + encodeURIComponent(no) + '&temp=0.' + String(no).length + '&phone=';
  }

  async function queryKuaidi(no, types) {
    const httpGet = window.Native && window.Native.httpGet;
    if (!httpGet) return null;
    for (const t of types) {
      let body = '';
      try { body = httpGet(kdUrl(no, t)); } catch (e) { continue; }
      if (!body) continue;
      let j;
      try { j = JSON.parse(body); } catch (e) { continue; }
      if (j.status !== '200' || !Array.isArray(j.data) || !j.data.length) continue;
      // 快递100 可能把单号匹配到别的承运商，com 不一致就是别人的包裹
      const com = String(j.com || '').toLowerCase();
      if (com && com !== t) continue;
      const st = KD_STATE[Number(j.state)] || ['in_transit', '运输中'];
      const events = j.data.map((e) => ({
        time: e.ftime || e.time || '', text: e.context || '', where: '',
      })).filter((e) => e.text);
      if (!events.length) continue;
      return {
        ok: true, no, status: st[0], statusText: st[1], carrier: t,
        latest: events[0].text, latestTime: events[0].time,
        events, updatedAt: new Date().toISOString(),
      };
    }
    return null;
  }

  async function queryTrack(no, forcedCarrier) {
    const forced = (forcedCarrier || '').trim();
    let types = forced ? [forced] : domesticTypes(no);
    if (types && window.Native && window.Native.httpGet) {
      const kd = await queryKuaidi(no, types);
      if (kd) return kd;
    }
    if (forced && !window.Native) types = [forced];
    const base = (db.settings.base || location.origin).replace(/\/$/, '');
    const url = new URL('/api/track', base);
    url.searchParams.set('no', no);
    if (forced) url.searchParams.set('carrier', forced);
    if (db.settings.token) url.searchParams.set('token', db.settings.token);
    const r = await fetch(url, { headers: { accept: 'application/json' } });
    const j = await r.json().catch(() => ({ ok: false, error: `HTTP ${r.status}` }));
    if (!j.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  }

  /** 把接口结果写进一条包裹（含取件码自动捡拾） */
  function applyTrack(it, j) {
    Object.assign(it, {
      status: j.status, statusText: j.statusText, carrier: j.carrier,
      latest: j.latest, latestTime: j.latestTime, events: j.events || [],
      updatedAt: j.updatedAt || new Date().toISOString(),
    });
    if (!it.pickup) {
      const code = detectPickup(j.latest) || detectPickup((j.events || []).map((e) => e.text).join(' '));
      if (code) it.pickup = code;
    }
  }

  async function refreshOne(it, btn) {
    if (!it.no) return toast('这单没有单号');
    if (btn) { btn.disabled = true; btn.textContent = '查询中…'; }
    try {
      const j = await queryTrack(it.no, it.carrierCode);
      applyTrack(it, j);
      save(); render();
      toast(j.status === 'notfound' ? '还没轨迹，晚点再刷' : '已更新');
    } catch (err) {
      toast('查询失败：' + err.message);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '刷新轨迹'; }
    }
  }

  /** 刷新 = 先同步家里人的改动，再刷在途件的轨迹 */
  async function refreshEverything(silent) {
    if (roomCode()) {
      try { await syncNow(true); } catch { /* 同步失败也继续刷轨迹 */ }
    }
    const list = db.items.filter((i) => i.no && i.status !== 'delivered' && !i.archived);
    if (!list.length) {
      if (!silent) toast('没有要刷新的');
      return;
    }
    if (!silent) toast(`刷新 ${list.length} 件…`);
    for (const it of list) {
      try {
        applyTrack(it, await queryTrack(it.no, it.carrierCode));
      } catch { /* 单条失败不影响其他 */ }
    }
    save(); render();
    if (!silent) toast('刷新完成');
  }

  $('refreshAll').onclick = () => refreshEverything(false);

  /**
   * 打开页面时自动刷一遍：只在途的、且 30 分钟内没查过的。
   * 不做定时轮询，免得太快烧光 17TRACK 的免费额度。
   */
  const AUTO_REFRESH_MINUTES = 30;
  async function autoRefresh() {
    if (!db.settings.token) return;
    const now = Date.now();
    const list = db.items.filter((i) => {
      if (!i.no || i.archived || i.status === 'delivered' || i.status === 'exception') return false;
      if (!i.updatedAt) return true;
      return now - new Date(i.updatedAt).getTime() > AUTO_REFRESH_MINUTES * 60000;
    });
    if (!list.length) return;
    toast(`自动刷新 ${list.length} 件…`);
    for (const it of list) {
      try {
        applyTrack(it, await queryTrack(it.no, it.carrierCode));
        save();
      } catch { /* 忽略单条失败 */ }
    }
    render();
  }

  /* ---------- 弹层 ---------- */
  function openSheet(id) { $(id).classList.add('on'); }
  function closeSheets() { document.querySelectorAll('.sheet').forEach((s) => s.classList.remove('on')); }
  document.addEventListener('click', (e) => {
    if (e.target.matches('[data-close]')) closeSheets();
    if (e.target.classList.contains('sheet')) closeSheets();
  });

  /* ---------- 添加 / 编辑 ---------- */
  let editing = null;
  let editGroups = [];

  function fillGroupPicker() {
    const box = $('f_groups');
    if (!box) return;
    box.innerHTML = db.groups.length
      ? db.groups.map((g) => `<button class="chip ${editGroups.includes(g)?'on':''}" data-eg="${esc(g)}">${esc(g)}</button>`).join('')
      : '<span style="font-size:12px;color:var(--dim2)">还没有分组，点下面新建</span>';
    box.querySelectorAll('[data-eg]').forEach((b) => {
      b.onclick = () => {
        const g = b.dataset.eg;
        const i = editGroups.indexOf(g);
        if (i >= 0) editGroups.splice(i, 1);
        else editGroups.push(g);
        fillGroupPicker();
      };
    });
  }

  function openEdit(it) {
    editing = it || null;
    $('editTitle').textContent = it ? '编辑包裹' : '添加包裹';
    $('f_name').value = it?.name || '';
    $('f_no').value = it?.no || '';
    $('f_platform').value = (it && it.platform) ? it.platform : 'other';
    editGroups = it
      ? (Array.isArray(it.groups) ? it.groups.slice() : (it.group ? [it.group] : []))
      : [];
    fillGroupPicker();
    $('f_pickup').value = it?.pickup || '';
    $('f_note').value = it?.note || '';
    if ($('f_carrier')) $('f_carrier').value = it?.carrierCode || '';
    $('delItem').style.display = it ? 'block' : 'none';
    openSheet('editSheet');
  }

  $('addBtn').onclick = () => openEdit(null);

  $('saveItem').onclick = () => {
    const name = $('f_name').value.trim();

  /* ---------- 家庭同步 ---------- */

  /** 所有房间依次同步：每个房间只推/拉它绑定分组的包裹 */
  async function syncNow(silent) {
    const rooms = db.settings.rooms || [];
    if (!rooms.length) { if (!silent) toast('还没有加入家庭码'); return; }
    if (syncing) return;
    syncing = true;
    let total = 0, okCount = 0;
    try {
      for (const r of rooms) {
        try {
          total += await syncRoom(r, silent);
          okCount++;
        } catch (e) {
          if (!silent) toast(`房间 ${r.code} 同步失败：${e.message}`);
        }
      }
      lastSync = new Date().toISOString();
      localStorage.setItem(KEY, JSON.stringify(db));
      refreshFilters(); render(); refreshSyncState();
      if (!silent) toast(`同步完成：${okCount}/${rooms.length} 个房间，共 ${total} 件`);
    } finally {
      syncing = false;
    }
  }

  async function syncRoom(r, silent) {
    const base = (db.settings.base || location.origin).replace(/\/$/, '');
    const url = new URL('/api/sync', base);
    url.searchParams.set('room', r.code);
    if (db.settings.token) url.searchParams.set('token', db.settings.token);

    // 分组名为空 → 跟随创建者
    let group = (r.group || '').trim();
    if (!group) {
      try {
        const info = await fetch(url, { headers: { accept: 'application/json' } }).then((x) => x.json());
        const serverName = (info && info.roomName || '').trim();
        if (serverName) {
          group = serverName;
          r.group = serverName;
          if (!db.groups.includes(serverName)) db.groups.push(serverName);
        }
      } catch (e) { /* 忽略 */ }
    }
    if (!group) throw new Error('这个房间还没有名字');

    const inRoom = (it) => itemInGroup(it, group);
    const shared = db.items.filter(inRoom);

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        items: shared,
        groups: [group],
        deleted: db.deleted || {},
        roomName: group,
        members: { [db.settings.deviceId]: db.settings.nickname || '' },
      }),
    });
    const j = await res.json().catch(() => ({ ok: false, error: 'HTTP ' + res.status }));
    if (!j.ok) throw new Error(j.error || 'HTTP ' + res.status);
    if (j.members && typeof j.members === 'object') r.members = j.members;

    const others = db.items.filter((i) => !inRoom(i));
    const remote = Array.isArray(j.items) ? j.items : [];
    db.items = others.concat(remote.map((it) => {
      const gs = Array.isArray(it.groups) ? it.groups.slice() : (it.group ? [it.group] : []);
      if (!gs.includes(group)) gs.push(group);
      return { ...it, groups: gs, group: gs[0] || '' };
    }));
    dedupeByNo();
    return remote.length;
  }

  /* ---------- 分享码：把人家的包裹搬过来 ---------- */
  const SHARE_PREFIX = 'PARCEL1.';

  function b64enc(str) {
    const bytes = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64dec(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  const SHARE_FIELDS = ['name', 'no', 'platform', 'group', 'groups', 'note', 'pickup', 'status',
    'statusText', 'carrier', 'latest', 'latestTime', 'events', 'updatedAt', 'createdAt', 'archived'];

  function buildShareCode(items) {
    const payload = {
      v: 1,
      at: new Date().toISOString(),
      groups: db.groups,
      items: items.map((it) => {
        const o = {};
        SHARE_FIELDS.forEach((k) => { if (it[k] !== undefined) o[k] = it[k]; });
        return o;
      }),
    };
    return SHARE_PREFIX + b64enc(JSON.stringify(payload));
  }

  function parseShareCode(raw) {
    const text = String(raw || '').trim().replace(/\s+/g, '');
    if (!text.startsWith(SHARE_PREFIX)) throw new Error('这不像分享码');
    const payload = JSON.parse(b64dec(text.slice(SHARE_PREFIX.length)));
    if (!Array.isArray(payload.items)) throw new Error('分享码里没有包裹');
    return payload;
  }

  function mergeShare(payload) {
    let added = 0, updated = 0;
    for (const inc of payload.items) {
      const key = (inc.no || '').toUpperCase();
      const exist = key
        ? db.items.find((i) => (i.no || '').toUpperCase() === key)
        : db.items.find((i) => !i.no && i.name === inc.name);
      if (!exist) {
        db.items.push(normalizeItem({ id: uid(), status: 'pending', events: [], ...inc }));
        added++;
      } else {
        // 同单号：只补空字段，再用更新的轨迹覆盖
        for (const k of SHARE_FIELDS) {
          if (exist[k] === undefined || exist[k] === '' || exist[k] === null) {
            if (inc[k] !== undefined) exist[k] = inc[k];
          }
        }
        if (inc.updatedAt && (!exist.updatedAt || inc.updatedAt > exist.updatedAt)) {
          ['status', 'statusText', 'carrier', 'latest', 'latestTime', 'events', 'updatedAt', 'pickup']
            .forEach((k) => { if (inc[k] !== undefined) exist[k] = inc[k]; });
        }
        updated++;
      }
    }
    if (Array.isArray(payload.groups)) {
      payload.groups.forEach((g) => {
        if (g && !db.groups.includes(g)) db.groups.push(g);
      });
    }
    return { added, updated };
  }

  function syncBallUI() {

    const dot = $('ballDot');
    if (dot) dot.textContent = on ? '◉' : '◎';
    btn.title = on ? '悬浮球显示中，点此隐藏' : '悬浮球已隐藏，点此显示';
  }

  function toggleBall() {
    if (!window.Native || !window.Native.setBallEnabled) return;
    let on = true;
    try { on = window.Native.ballEnabled(); } catch (e) { return; }
    try {
      window.Native.setBallEnabled(!on);
      syncBallUI();
      toast(!on ? '悬浮球已显示' : '悬浮球已隐藏');
    } catch (e) { toast('切换失败'); }
  }

  /* ---------- 弹层：滑到顶再往下拉就关掉 ---------- */
  (function setupSheetDrag() {
    let panel = null, startY = null, dist = 0;

    // 松手关闭的门槛：屏幕高度的 35%（大于一半就不合理，这里永远不到一半）
    function closeThreshold() {
      return Math.min(window.innerHeight * 0.35, window.innerHeight * 0.5);
    }
    // 拖到离屏幕底边这么近就直接关，不用松手
    function bottomZone() {
      return window.innerHeight - 72;
    }

    document.addEventListener('touchstart', (e) => {
      const p = e.target.closest('.sheet.on .panel');
      if (!p || e.touches.length !== 1) return;
      panel = p;
      startY = e.touches[0].clientY;
      dist = 0;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!panel || startY === null) return;
      if (panel.scrollTop > 0) { panel = null; return; }
      const dy = e.touches[0].clientY - startY;
      if (dy <= 0) { dist = 0; panel.style.transform = ''; return; }
      dist = dy;
      if (dy > 6) e.preventDefault();
      // 1:1 跟手，能一路拖到屏幕底
      panel.style.transform = `translateY(${dy}px)`;

      // 拉到贴近屏幕底边：直接回首页
      if (dy > 40 && e.touches[0].clientY >= bottomZone()) {
        panel.style.transform = '';
        panel = null;
        startY = null;
        dist = 0;
        closeSheets();
      }
    }, { passive: false });

    document.addEventListener('touchend', () => {
      if (panel) {
        panel.style.transform = '';
        if (dist > closeThreshold()) closeSheets();
      }
      panel = null;
      startY = null;
      dist = 0;
    });
  })();

  /* ---------- 下拉刷新（网页/WebView 通用，不用杀后台） ---------- */
  (function setupPull() {
    const hint = $('pullHint');
    let startY = null, dist = 0, active = false, busy = false;

    function reset() {
      active = false;
      startY = null;
      dist = 0;
      if (hint) {
        hint.style.transform = 'translate(-50%,-46px)';
        hint.style.opacity = '0';
      }
    }

    document.addEventListener('touchstart', (e) => {
      if (busy || window.scrollY > 2 || e.touches.length !== 1) return;
      // 弹层打开时不触发下拉刷新（这也是之前"设置页下不去"的原因）
      if (document.querySelector('.sheet.on')) return;
      startY = e.touches[0].clientY;
      dist = 0;
      active = true;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      if (!active || startY === null) return;
      const dy = e.touches[0].clientY - startY;
      if (dy <= 0 || window.scrollY > 2) return reset();
      dist = dy;
      if (dy > 10) {
        e.preventDefault();
        const offset = Math.min(56, dy * 0.45);
        hint.style.transform = `translate(-50%, ${offset - 46}px)`;
        hint.style.opacity = '1';
        hint.textContent = dy > 72 ? '松开刷新' : '下拉刷新';
      }
    }, { passive: false });

    document.addEventListener('touchend', async () => {
      if (!active) return;
      const should = dist > 72;
      if (!should) return reset();
      active = false;
      startY = null;
      busy = true;
      hint.style.transform = 'translate(-50%, 8px)';
      hint.textContent = '同步中…';
      try {
        await refreshEverything(true);
        hint.textContent = '已刷新';
      } catch (e) {
        hint.textContent = '刷新失败';
      }
      setTimeout(() => {
        busy = false;
        reset();
      }, 700);
    });
  })();

  /* ---------- 启动 ---------- */
  if (!db.settings.deviceId) {
    db.settings.deviceId = uid();
    localStorage.setItem(KEY, JSON.stringify(db));
  }

  refreshFilters();
  render();
  if (!db.settings.token) {
    setTimeout(() => toast('先去右上角 ⚙ 填 APP_TOKEN'), 800);
  } else {
    setTimeout(autoRefresh, 600);
  }
  setTimeout(() => checkUpdate(true), 1500);
  setTimeout(() => window.__checkPendingAdd && window.__checkPendingAdd(), 1200);

  // 有房间码就开机同步一次
  if (roomCode()) setTimeout(() => syncNow(true).catch(() => {}), 900);

  // 回到前台就查一次，平时每 4 秒查一次（只是个本地调用，不费电不费流量）
  setTimeout(checkAccBar, 2000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      checkAccBar();
      if (roomCode()) syncNow(true).catch(() => {});
    }
  });
  setInterval(() => {
    if (document.visibilityState === 'visible') checkAccBar();
  }, 4000);

  // 前台每 60 秒自动同步一次，不用手动刷
  setInterval(() => {
    if (document.visibilityState === 'visible' && roomCode()) syncNow(true).catch(() => {});
  }, 60000);

  /* ---------- 原生注入的取件码 ---------- */
  window.__onPickupCode = function (code, tracking, source) {
    code = String(code || '').trim();
    if (!code) return;
    const norm = (s) => String(s || '').toUpperCase().replace(/\s+/g, '');
    db.pendingCodes = db.pendingCodes || [];

    // 1. 先按短信里带的单号精确匹配
    let target = tracking ? db.items.find((i) => !i.archived && norm(i.no) === norm(tracking)) : null;
    // 2. 没匹配到，退而求其次：最新一件还没填码的在途包裹
    if (!target) {
      target = db.items.filter((i) => !i.archived && i.status !== 'delivered' && !i.pickup)[0];
    }

    if (target) {
      if (target.pickup === code) return; // 已经填过了
      target.pickup = code;
      target.pickupSource = source || '';
      target.status = 'pickup';
      target.statusText = '待取件';
      target.updatedAt = new Date().toISOString();
      save(); render();
      toast(`取件码 ${code} 已填入「${target.name || target.no || '包裹'}」`);
    } else {
      db.pendingCodes.unshift({ code, tracking: tracking || '', source: source || '', at: new Date().toISOString() });
      save(); render();
      toast(`收到取件码 ${code}，点顶部卡片应用`);
    }
  };

  /* ---------- App 内才显示的功能 ---------- */
  if (window.Native) {
    $('appBox').style.display = 'block';
    $('checkUpdateBtn').onclick = () => checkUpdate(false);
    $('permBtn').onclick = () => openPermSheet();
    $('ballBtn').onclick = () => toggleBall();
    syncBallUI();
    try {
      $('accState').textContent = '抓单号现在走截屏 OCR，不再需要无障碍；之前开过的可以去系统设置里关掉。';
    } catch { /* 老版本没有 */ }
  }

  /* ---------- 权限确认面板 ---------- */
  function permRow(name, desc, ok, actionLabel, onAction) {
    return `<div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)">
      <div style="flex:1;min-width:0">
        <div style="font-size:14px">${esc(name)}</div>
        <div style="font-size:12px;color:var(--dim2);margin-top:3px">${esc(desc)}</div>
      </div>
      <button class="ghost" style="width:auto;margin:0;padding:8px 14px;flex:0 0 auto"
        data-perm="${esc(name)}">${esc(ok ? '已开启' : actionLabel)}</button>
    </div>`;
  }

  function openPermSheet() {
    const rows = [];
    let sms = true, notif = true, acc = false, running = false;
    try { if (window.Native.smsGranted) sms = window.Native.smsGranted(); } catch (e) {}
    try { if (window.Native.notifGranted) notif = window.Native.notifGranted(); } catch (e) {}
    try { acc = window.Native.accessibilityEnabled(); } catch (e) {}
    try { if (window.Native.accessibilityRunning) running = window.Native.accessibilityRunning(); } catch (e) {}

    rows.push(permRow('通知读取', '丰巢/菜鸟/淘宝推送里的取件码', notif, '去开启'));
    rows.push(permRow('短信', '驿站、快递公司的取件短信', sms, '去开启'));
    rows.push(permRow('截屏 OCR', '点球截图后本地识别单号', false, '重新授权'));

    const box = $('permList');
    box.innerHTML = rows.join('');

    box.querySelectorAll('[data-perm]').forEach((btn) => {
      const name = btn.dataset.perm;
      btn.onclick = () => {
        try {
          if (name === '通知读取') window.Native.openNotificationSettings();
          else if (name === '短信') window.Native.openAppSettings();
          else if (name === '截屏 OCR') {
            if (window.Native.requestCapture) window.Native.requestCapture();
            else toast('先更新 App');
          }
        } catch (e) { toast('打不开设置'); }
      };
    });

    openSheet('permSheet');
  }
})();
</script>
</body>
