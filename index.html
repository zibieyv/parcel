<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>包裹</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0f1115; --card:#171a21; --card2:#1d222b; --line:#242a35; --text:#e8eaee;
  --dim:#8b93a1; --dim2:#5f6875; --accent:#3d7eff; --ok:#35d07f; --warn:#f5b545; --bad:#ff6b6b;
  --radius:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);min-height:100vh;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:calc(96px + var(--safe-b));
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{
  font:inherit;width:100%;background:#0d1016;color:var(--text);
  border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}

/* 顶栏 */
header{
  position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:14px 16px 10px;
}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
.hcount{font-size:12px;color:var(--dim);font-weight:400;margin-left:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:17px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.updatebar{
  display:none;align-items:center;justify-content:space-between;gap:12px;
  margin:0 16px 0;padding:10px 14px;border-radius:12px;background:#1b2740;border:1px solid #2f4d85;
  font-size:13px;color:#a8c4ff;
}
.updatebar button{
  flex:0 0 auto;padding:8px 14px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;
}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:13px;color:var(--dim);white-space:nowrap;
}
.chip.on{background:#1b2740;border-color:#2f4d85;color:#a8c4ff}

/* 列表 */
main{padding:14px 16px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;margin-bottom:12px;position:relative;overflow:hidden;
}
.card.done{opacity:.62}
.card .top{display:flex;align-items:flex-start;gap:10px}
.pf{
  flex:0 0 auto;font-size:11px;padding:3px 8px;border-radius:7px;background:#232a36;
  color:#b9c2d0;margin-top:2px;
}
.title{flex:1;min-width:0}
.title b{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title b .nt{font-weight:400;font-size:13px;color:var(--dim)}
.title .no{font-size:12px;color:var(--dim2);font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:2px;letter-spacing:.3px}
.status{font-size:12px;padding:4px 10px;border-radius:999px;background:#24304a;color:#9db8ff;white-space:nowrap}
.status.delivered{background:#17351f;color:#6ee7a0}
.status.delivering,.status.pickup{background:#3a2a10;color:#fbbf24}
.status.exception{background:#3a1a1a;color:#ff9b9b}

.latest{font-size:14px;color:#c3cad6;margin:10px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--dim2);margin-top:6px}
.pickup{
  margin-top:12px;background:#10241a;border:1px dashed #2f6b4b;border-radius:12px;
  padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.pickup span{font-size:12px;color:#7fd0a4}
.pickup b{font-size:26px;letter-spacing:3px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#7cf0ae}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{
  flex:1;padding:9px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
  font-size:13px;color:#c8d0dc;
}
.acts button:active{background:#2a3240}

.empty{text-align:center;color:var(--dim2);padding:70px 20px;font-size:14px;line-height:2}
.empty b{display:block;font-size:44px;margin-bottom:10px;opacity:.5}

/* 底部按钮 */
.fab{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--safe-b));
  background:var(--accent);color:#fff;border-radius:999px;padding:14px 30px;font-weight:600;
  box-shadow:0 8px 24px rgba(61,126,255,.4);z-index:30;font-size:15px;
}

/* 弹层 */
.sheet{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(0,0,0,.55);backdrop-filter:blur(2px);
}
.sheet.on{display:block}
.sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;
  background:#141821;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + var(--safe-b));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-size:16px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.sheet .x{color:var(--dim);font-size:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;margin-top:6px}
.danger{color:#ff8a8a}
.ghost{width:100%;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-top:8px;font-size:14px}

/* 详情时间线 */
.tl{margin-top:8px}
.tl .ev{padding:12px 0 12px 18px;border-left:2px solid var(--line);position:relative}
.tl .ev:last-child{border-left-color:transparent}
.tl .ev::before{content:"";position:absolute;left:-5px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--dim2)}
.tl .ev:first-child::before{background:var(--accent);box-shadow:0 0 0 4px rgba(61,126,255,.15)}
.tl .t{font-size:11px;color:var(--dim2);font-family:ui-monospace,monospace}
.tl .d{font-size:14px;margin-top:3px;color:#d5dbe4}
.tl .w{font-size:12px;color:var(--dim2);margin-top:2px}
.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);
  background:#2b3444;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
  opacity:0;transition:.2s;z-index:80;pointer-events:none;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>包裹<span class="hcount" id="cnt"></span></h1>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="refreshAll" title="全部刷新">↻</button>
      <button class="icon-btn" id="openSettings" title="设置">⚙</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
</header>

<div class="updatebar" id="updateBar"></div>

<main id="list"></main>

<button class="fab" id="addBtn">＋ 添加包裹</button>

<!-- 添加/编辑 -->
<div class="sheet" id="editSheet">
  <div class="panel">
    <h2><span id="editTitle">添加包裹</span><button class="x" data-close>取消</button></h2>
    <div class="field"><label>内容物 / 名称</label><input id="f_name" placeholder="例：恋人不行 5-8"></div>
    <div class="field"><label>快递单号</label><input id="f_no" placeholder="通过购物软件获取" autocapitalize="characters"></div>
    <div class="row2">
      <div class="field"><label>平台</label>
        <select id="f_platform">
          <option value="taobao">淘宝</option><option value="jd">京东</option>
          <option value="pdd">拼多多</option><option value="douyin">抖音商城</option>
          <option value="taobaoflash">淘宝闪送</option><option value="meituan">美团外卖</option>
          <option value="jdwaimai">京东外卖</option><option value="books">博客来</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div class="field"><label>分组</label>
        <select id="f_group"></select>
      </div>
    </div>
    <div class="field"><label>取件码（大多留空，到站会自动填）</label><input id="f_pickup" placeholder="6-4-12003"></div>
    <div class="field"><label>备注（可留空）</label><textarea id="f_note" placeholder="放哪个驿站 / 给谁的 / 多少钱"></textarea></div>
    <button class="primary" id="saveItem">保存</button>
    <button class="ghost danger" id="delItem" style="display:none">删除这个包裹</button>
  </div>
</div>

<!-- 详情 -->
<div class="sheet" id="detailSheet">
  <div class="panel">
    <h2><span id="d_title">轨迹</span><button class="x" data-close>关闭</button></h2>
    <div id="d_body"></div>
  </div>
</div>

<!-- 设置 -->
<div class="sheet" id="setSheet">
  <div class="panel">
    <h2><span>设置</span><button class="x" data-close>关闭</button></h2>
    <div class="field"><label>接口地址</label><input id="s_base" placeholder="https://parcel-seven-omega.vercel.app"></div>
    <div class="field"><label>APP_TOKEN</label><input id="s_token" placeholder="与 Vercel 环境变量一致"></div>
    <button class="primary" id="saveSettings">保存</button>

    <div class="field" style="margin-top:22px"><label>分组（一行一个）</label>
      <textarea id="s_groups" placeholder="我的&#10;家人的&#10;博客来"></textarea>
    </div>
    <button class="ghost" id="saveGroups">保存分组</button>

    <div id="appBox" style="display:none;margin-top:22px">
      <div class="field"><label>取件码自动抓取（仅 App 内可用）</label></div>
      <button class="ghost" id="notifBtn">开启「通知读取」权限</button>
      <button class="ghost" id="smsBtn">检查短信权限</button>
      <button class="ghost" id="checkUpdateBtn">检查更新</button>
      <button class="ghost" id="accBtn">开启读屏权限（悬浮球抓单号）</button>
      <p id="accState" style="font-size:12px;color:var(--dim2);line-height:1.7;margin-top:10px"></p>
      <p id="notifState" style="font-size:12px;color:var(--dim2);line-height:1.7;margin-top:10px"></p>
    </div>

    <a href="/apk/parcel-0.12.apk" download
       style="display:block;text-align:center;margin-top:22px;padding:12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:14px;color:#c8d0dc;text-decoration:none">
      下载安卓 App（v0.12，读屏抓单号）
    </a>

    <div style="margin-top:22px;display:flex;gap:10px">
      <button class="ghost" id="exportData">导出备份</button>
      <button class="ghost" id="importData">导入备份</button>
    </div>
    <p style="font-size:12px;color:var(--dim2);line-height:1.7;margin-top:16px">
      数据只存在这台设备的浏览器里，不上传。换手机或清缓存前先导出备份。
    </p>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const KEY = 'parcel.v1';
  const PLATFORM_NAME = {
    taobao:'淘宝', jd:'京东', pdd:'拼多多', douyin:'抖音', taobaoflash:'淘宝闪送',
    meituan:'美团', jdwaimai:'京东外卖', books:'博客来', other:'其他'
  };
  const STATUS_NAME = {
    pending:'待发货', in_transit:'运输中', pickup:'待取件', delivering:'派送中',
    delivered:'已签收', exception:'异常', notfound:'暂无轨迹'
  };

  const $ = (id) => document.getElementById(id);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // 轨迹文本里偶尔会带取件码（驿站/快递柜），顺手捡出来
  const PICKUP_RE = /(?:取件[码碼]|提货[码碼]|提貨[码碼]|取货[码碼]|领取[码碼])[^0-9]{0,6}([0-9][0-9\-]{2,12})/;
  function detectPickup(text) {
    if (!text) return '';
    const m = String(text).match(PICKUP_RE);
    if (!m) return '';
    return m[1].replace(/[^0-9\-]/g, '');
  }

  /* ---------- 存储 ---------- */
  const defaults = {
    items: [],
    groups: ['我的', '家人的'],
    settings: { base: location.origin, token: '' },
  };
  let db = load();

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!raw) return { ...defaults, groups: [...defaults.groups] };
      return {
        items: Array.isArray(raw.items) ? raw.items : [],
        groups: Array.isArray(raw.groups) ? raw.groups : [...defaults.groups],
        pendingCodes: Array.isArray(raw.pendingCodes) ? raw.pendingCodes : [],
        settings: { ...defaults.settings, ...(raw.settings || {}) },
      };
    } catch {
      return { ...defaults, groups: [...defaults.groups] };
    }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(db)); }

  /* ---------- 工具 ---------- */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
  }
  function fmtTime(s) {
    if (!s) return '';
    const d = new Date(s);
    if (isNaN(d)) return s;
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function relTime(s) {
    if (!s) return '';
    const diff = (Date.now() - new Date(s).getTime()) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return `${Math.floor(diff/60)} 分钟前`;
    if (diff < 86400) return `${Math.floor(diff/3600)} 小时前`;
    return `${Math.floor(diff/86400)} 天前`;
  }

  /* ---------- 筛选 ---------- */
  let filter = { type: 'all' };

  function refreshFilters() {
    const types = [
      ['all', '全部'], ['active', '在途'], ['pickup', '待取件'], ['delivered', '已签收'], ['archived', '已归档'],
    ];
    let html = types.map(([k, n]) => `<button class="chip ${filter.type===k?'on':''}" data-f="${k}">${n}</button>`).join('');
    for (const g of db.groups) {
      html += `<button class="chip ${filter.type==='g:'+g?'on':''}" data-f="g:${esc(g)}">${esc(g)}</button>`;
    }
    $('filters').innerHTML = html;
    $('filters').onclick = (e) => {
      const b = e.target.closest('[data-f]');
      if (!b) return;
      filter.type = b.dataset.f;
      refreshFilters();
      render();
    };
  }

  /* ---------- 列表 ---------- */
  function visibleItems() {
    const all = db.items;
    let list;
    if (filter.type === 'archived') {
      list = all.filter((i) => i.archived);
    } else {
      list = all.filter((i) => !i.archived);
      if (filter.type === 'active') list = list.filter((i) => !['delivered', 'exception'].includes(i.status));
      else if (filter.type === 'pickup') list = list.filter((i) => i.status === 'pickup' || (i.pickup && i.status !== 'delivered'));
      else if (filter.type === 'delivered') list = list.filter((i) => i.status === 'delivered');
      else if (filter.type.startsWith('g:')) list = list.filter((i) => i.group === filter.type.slice(2));
    }
    return list.sort((a, b) => {
      const rank = (x) => x.status === 'delivered' ? 2 : (x.pickup ? 0 : 1);
      const r = rank(a) - rank(b);
      if (r) return r;
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });
  }

  function render() {
    const list = visibleItems();
    $('cnt').textContent = list.length ? `${list.length} 件` : '';
    const pending = (db.pendingCodes || []).map((p) => `
      <div class="card" style="border-color:#4a3a12;background:#1e1a10">
        <div class="top">
          <span class="pf">取件码</span>
          <div class="title"><b>${esc(p.code)}</b><div class="no">来自 ${esc(p.source || '未知')} · 还没归到哪个包裹</div></div>
        </div>
        <div class="acts"><button data-apply="${esc(p.code)}">应用到包裹</button></div>
      </div>`).join('');
    if (!list.length && !pending) {
      $('list').innerHTML = `<div class="empty"><b>📦</b>还没有包裹<br><span style="color:var(--dim2);font-size:13px">点下面的按钮，粘一个单号进来</span></div>`;
      return;
    }
    $('list').innerHTML = pending + list.map(cardHtml).join('');
  }

  function cardHtml(it) {
    const st = it.status || 'pending';
    const cls = st === 'delivered' ? 'done' : '';
    const pickup = it.pickup ? `
      <div class="pickup" data-copy="${esc(it.pickup)}">
        <span>取件码</span><b>${esc(it.pickup)}</b>
      </div>` : '';
    const when = it.latestTime ? fmtTime(it.latestTime) : (it.updatedAt ? fmtTime(it.updatedAt) : '');
    return `
      <div class="card ${cls}" data-id="${it.id}">
        <div class="top">
          <span class="pf">${esc(PLATFORM_NAME[it.platform] || '其他')}</span>
          <div class="title">
            <b>${esc(it.name || it.no || '未命名')}${it.note ? `<span class="nt">&nbsp;&nbsp;备注：${esc(String(it.note).replace(/\s+/g, ' '))}</span>` : ''}</b>
            ${it.no ? `<div class="no">${esc(it.no)}</div>` : ''}
          </div>
          <span class="status ${st}">${esc(STATUS_NAME[st] || st)}</span>
        </div>
        ${it.latest ? `<div class="latest">${esc(it.latest)}</div>` : ''}
        ${when ? `<div class="meta">${esc(when)}${it.carrier ? ' · ' + esc(it.carrier) : ''}</div>` : ''}
        ${pickup}
        <div class="acts">
          <button data-act="refresh">刷新轨迹</button>
          <button data-act="edit">编辑</button>
          ${it.archived
            ? '<button data-act="unarchive">恢复</button>'
            : (st === 'delivered' ? '<button data-act="archive">归档</button>' : '')}
        </div>
      </div>`;
  }

  $('list').addEventListener('click', async (e) => {
    const applyBtn = e.target.closest('[data-apply]');
    if (applyBtn) {
      const code = applyBtn.dataset.apply;
      const target = db.items.filter((i) => !i.archived && i.status !== 'delivered' && !i.pickup)[0];
      if (!target) { toast('先添加一个在途包裹'); return; }
      target.pickup = code;
      db.pendingCodes = (db.pendingCodes || []).filter((p) => p.code !== code);
      save(); render();
      toast(`已应用到「${target.name || target.no || '包裹'}」`);
      return;
    }
    const copyEl = e.target.closest('[data-copy]');
    if (copyEl) {
      try { await navigator.clipboard.writeText(copyEl.dataset.copy); toast('取件码已复制'); }
      catch { toast(copyEl.dataset.copy); }
      return;
    }
    const card = e.target.closest('.card');
    if (!card) return;
    const it = db.items.find((x) => x.id === card.dataset.id);
    if (!it) return;
    const btn = e.target.closest('[data-act]');
    if (btn) {
      e.stopPropagation();
      const act = btn.dataset.act;
      if (act === 'refresh') refreshOne(it, btn);
      if (act === 'edit') openEdit(it);
      if (act === 'archive') {
        it.archived = true; save(); render(); toast('已归档，去「已归档」里找');
      }
      if (act === 'unarchive') {
        it.archived = false; save(); render(); toast('已恢复到列表');
      }
      return;
    }
    openDetail(it);
  });

  /* ---------- 查询 ---------- */
  async function queryTrack(no) {
    const base = (db.settings.base || location.origin).replace(/\/$/, '');
    const url = new URL('/api/track', base);
    url.searchParams.set('no', no);
    if (db.settings.token) url.searchParams.set('token', db.settings.token);
    const r = await fetch(url, { headers: { accept: 'application/json' } });
    const j = await r.json().catch(() => ({ ok: false, error: `HTTP ${r.status}` }));
    if (!j.ok) throw new Error(j.error || `HTTP ${r.status}`);
    return j;
  }

  /** 把接口结果写进一条包裹（含取件码自动捡拾） */
  function applyTrack(it, j) {
    Object.assign(it, {
      status: j.status, statusText: j.statusText, carrier: j.carrier,
      latest: j.latest, latestTime: j.latestTime, events: j.events || [],
      updatedAt: j.updatedAt || new Date().toISOString(),
    });
    if (!it.pickup) {
      const code = detectPickup(j.latest) || detectPickup((j.events || []).map((e) => e.text).join(' '));
      if (code) it.pickup = code;
    }
  }

  async function refreshOne(it, btn) {
    if (!it.no) return toast('这单没有单号');
    if (btn) { btn.disabled = true; btn.textContent = '查询中…'; }
    try {
      const j = await queryTrack(it.no);
      applyTrack(it, j);
      save(); render();
      toast(j.status === 'notfound' ? '还没轨迹，晚点再刷' : '已更新');
    } catch (err) {
      toast('查询失败：' + err.message);
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '刷新轨迹'; }
    }
  }

  $('refreshAll').onclick = async () => {
    const list = db.items.filter((i) => i.no && i.status !== 'delivered' && !i.archived);
    if (!list.length) return toast('没有要刷新的');
    toast(`刷新 ${list.length} 件…`);
    for (const it of list) {
      try {
        applyTrack(it, await queryTrack(it.no));
      } catch { /* 单条失败不影响其他 */ }
    }
    save(); render();
    toast('刷新完成');
  };

  /**
   * 打开页面时自动刷一遍：只在途的、且 30 分钟内没查过的。
   * 不做定时轮询，免得太快烧光 17TRACK 的免费额度。
   */
  const AUTO_REFRESH_MINUTES = 30;
  async function autoRefresh() {
    if (!db.settings.token) return;
    const now = Date.now();
    const list = db.items.filter((i) => {
      if (!i.no || i.archived || i.status === 'delivered' || i.status === 'exception') return false;
      if (!i.updatedAt) return true;
      return now - new Date(i.updatedAt).getTime() > AUTO_REFRESH_MINUTES * 60000;
    });
    if (!list.length) return;
    toast(`自动刷新 ${list.length} 件…`);
    for (const it of list) {
      try {
        applyTrack(it, await queryTrack(it.no));
        save();
      } catch { /* 忽略单条失败 */ }
    }
    render();
  }

  /* ---------- 弹层 ---------- */
  function openSheet(id) { $(id).classList.add('on'); }
  function closeSheets() { document.querySelectorAll('.sheet').forEach((s) => s.classList.remove('on')); }
  document.addEventListener('click', (e) => {
    if (e.target.matches('[data-close]')) closeSheets();
    if (e.target.classList.contains('sheet')) closeSheets();
  });

  /* ---------- 添加 / 编辑 ---------- */
  let editing = null;

  function fillGroupSelect(sel) {
    sel.innerHTML = '<option value="">未分组</option>' + db.groups.map((g) => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
  }

  function openEdit(it) {
    editing = it || null;
    $('editTitle').textContent = it ? '编辑包裹' : '添加包裹';
    $('f_name').value = it?.name || '';
    $('f_no').value = it?.no || '';
    $('f_platform').value = it?.platform || 'taobao';
    fillGroupSelect($('f_group'));
    $('f_group').value = it?.group || '';
    $('f_pickup').value = it?.pickup || '';
    $('f_note').value = it?.note || '';
    $('delItem').style.display = it ? 'block' : 'none';
    openSheet('editSheet');
    if (!it) setTimeout(() => $('f_name').focus(), 250);
  }

  $('addBtn').onclick = () => openEdit(null);

  $('saveItem').onclick = () => {
    const name = $('f_name').value.trim();
    const no = $('f_no').value.trim().toUpperCase().replace(/\s+/g, '');
    if (!name && !no) return toast('至少填个名字或单号');
    const data = {
      name, no,
      platform: $('f_platform').value,
      group: $('f_group').value,
      pickup: $('f_pickup').value.trim(),
      note: $('f_note').value.trim(),
    };
    if (editing) {
      Object.assign(editing, data);
    } else {
      db.items.unshift({
        id: uid(), ...data, status: 'pending', statusText: '', carrier: '',
        latest: '', latestTime: '', events: [], createdAt: new Date().toISOString(),
      });
    }
    save(); closeSheets(); render();
    if (!editing && no) {
      const it = db.items[0];
      if (it.no) refreshOne(it);
    }
  };

  $('delItem').onclick = () => {
    if (!editing) return;
    if (!confirm('删掉这个包裹？')) return;
    db.items = db.items.filter((i) => i.id !== editing.id);
    save(); closeSheets(); render(); toast('已删除');
  };

  /* ---------- 详情 ---------- */
  function openDetail(it) {
    $('d_title').textContent = it.name || it.no || '轨迹';
    const events = (it.events || []).map((e) => `
      <div class="ev">
        <div class="t">${esc(fmtTime(e.time) || e.time || '')}</div>
        <div class="d">${esc(e.text)}</div>
        ${e.where ? `<div class="w">${esc(e.where)}</div>` : ''}
      </div>`).join('');
    $('d_body').innerHTML = `
      ${it.pickup ? `<div class="pickup" style="margin:0 0 14px"><span>取件码</span><b>${esc(it.pickup)}</b></div>` : ''}
      <div class="meta" style="margin:0 0 12px">
        ${esc(it.no || '无单号')}${it.carrier ? ' · ' + esc(it.carrier) : ''}
        ${it.updatedAt ? ' · ' + relTime(it.updatedAt) + '更新' : ''}
      </div>
      ${it.note ? `<div style="font-size:14px;color:#c3cad6;margin-bottom:12px">${esc(it.note)}</div>` : ''}
      <div class="tl">${events || '<div style="color:var(--dim2);font-size:14px">还没有轨迹，点卡片上的「刷新轨迹」试试</div>'}</div>`;
    openSheet('detailSheet');
  }

  /* ---------- 设置 ---------- */
  $('openSettings').onclick = () => {
    $('s_base').value = db.settings.base || location.origin;
    $('s_token').value = db.settings.token || '';
    $('s_groups').value = db.groups.join('\n');
    openSheet('setSheet');
  };

  $('saveSettings').onclick = () => {
    db.settings.base = $('s_base').value.trim() || location.origin;
    db.settings.token = $('s_token').value.trim();
    save(); toast('设置已保存');
  };

  $('saveGroups').onclick = () => {
    db.groups = $('s_groups').value.split('\n').map((s) => s.trim()).filter(Boolean);
    save(); refreshFilters(); render(); toast('分组已保存');
  };

  $('exportData').onclick = () => {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `parcel-backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    toast('已导出');
  };

  $('importData').onclick = () => $('fileInput').click();
  $('fileInput').onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.items)) throw new Error('格式不对');
      db = { items: data.items, groups: data.groups || db.groups, settings: { ...db.settings, ...(data.settings || {}) } };
      save(); refreshFilters(); render(); closeSheets(); toast('已导入');
    } catch (err) {
      toast('导入失败：' + err.message);
    }
    e.target.value = '';
  };

  /* ---------- 检查更新（只在 App 里生效） ---------- */
  async function checkUpdate(silent) {
    const cur = (window.Native && window.Native.versionCode) ? window.Native.versionCode() : 0;
    if (!cur) { if (!silent) toast('网页版不用更新，刷新即可'); return; }
    try {
      const r = await fetch('/apk/version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) { if (!silent) toast('暂时拿不到版本信息'); return; }
      const j = await r.json();
      if (j.versionCode > cur) {
        const bar = $('updateBar');
        bar.innerHTML = `<span>发现新版本 ${esc(j.versionName)}</span><button id="doUpdate">立即更新</button>`;
        bar.style.display = 'flex';
        $('doUpdate').onclick = () => {
          window.Native.installUpdate(j.url);
          toast('开始下载，完成后会弹出安装');
        };
        if (!silent) toast(`有新版本 ${j.versionName}`);
      } else if (!silent) {
        toast('已经是最新版（v' + window.Native.version() + '）');
      }
    } catch (e) {
      if (!silent) toast('检查更新失败');
    }
  }

  /* ---------- 读屏抓来的单号 ---------- */
  window.__checkPendingAdd = function () {
    if (!window.Native || !window.Native.consumePendingAdd) return;
    let raw = '';
    try { raw = window.Native.consumePendingAdd() || ''; } catch (e) { return; }
    if (!raw) return;
    let o = {};
    try { o = JSON.parse(raw); } catch (e) { return; }
    const no = String(o.no || '').toUpperCase().trim();
    if (!no) return;
    const src = o.source || '';
    const plat = /淘宝/.test(src) ? 'taobao'
      : /京东/.test(src) ? 'jd'
      : /拼多多/.test(src) ? 'pdd'
      : /抖音/.test(src) ? 'douyin' : 'other';
    openEdit(null);
    $('f_no').value = no;
    $('f_platform').value = plat;
    if (!$('f_name').value) $('f_name').value = src ? src + ' 的包裹' : '';
    toast('抓到单号 ' + no + '，确认后保存');
  };

  /* ---------- 启动 ---------- */
  refreshFilters();
  render();
  if (!db.settings.token) {
    setTimeout(() => toast('先去右上角 ⚙ 填 APP_TOKEN'), 800);
  } else {
    setTimeout(autoRefresh, 600);
  }
  setTimeout(() => checkUpdate(true), 1500);
  setTimeout(() => window.__checkPendingAdd && window.__checkPendingAdd(), 1200);

  /* ---------- 原生注入的取件码 ---------- */
  window.__onPickupCode = function (code, tracking, source) {
    code = String(code || '').trim();
    if (!code) return;
    const norm = (s) => String(s || '').toUpperCase().replace(/\s+/g, '');
    db.pendingCodes = db.pendingCodes || [];

    // 1. 先按短信里带的单号精确匹配
    let target = tracking ? db.items.find((i) => !i.archived && norm(i.no) === norm(tracking)) : null;
    // 2. 没匹配到，退而求其次：最新一件还没填码的在途包裹
    if (!target) {
      target = db.items.filter((i) => !i.archived && i.status !== 'delivered' && !i.pickup)[0];
    }

    if (target) {
      if (target.pickup === code) return; // 已经填过了
      target.pickup = code;
      target.pickupSource = source || '';
      target.status = 'pickup';
      target.statusText = '待取件';
      save(); render();
      toast(`取件码 ${code} 已填入「${target.name || target.no || '包裹'}」`);
    } else {
      db.pendingCodes.unshift({ code, tracking: tracking || '', source: source || '', at: new Date().toISOString() });
      save(); render();
      toast(`收到取件码 ${code}，点顶部卡片应用`);
    }
  };

  /* ---------- App 内才显示的功能 ---------- */
  if (window.Native) {
    $('appBox').style.display = 'block';
    $('notifBtn').onclick = () => window.Native.openNotificationSettings();
    $('smsBtn').onclick = () => window.Native.openAppSettings();
    $('checkUpdateBtn').onclick = () => checkUpdate(false);
    $('accBtn').onclick = () => window.Native.openAccessibilitySettings();
    try {
      const acc = window.Native.accessibilityEnabled();
      $('accState').textContent = acc
        ? '读屏：已开启。去淘宝/抖音的物流详情页，点左边的大肥鱼就能抓单号。'
        : '读屏：未开启。点上面按钮 → 无障碍里找到「包裹」→ 打开。';
    } catch { /* 老版本没有 */ }
    try {
      const on = window.Native.notificationAccessEnabled();
      $('notifState').textContent = on
        ? '通知读取：已开启。丰巢、菜鸟、淘宝等推送里的取件码会自动填进来。'
        : '通知读取：未开启。点上面的按钮，在列表里找到「包裹」打开开关。';
    } catch { /* 老版本 App 没有这个方法 */ }
  }
})();
</script>
</body>
</html>
